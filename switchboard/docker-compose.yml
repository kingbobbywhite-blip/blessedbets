# Optional: your own Postgres instead of the built-in one.
#   docker compose up -d
#   DATABASE_URL=postgres://switchboard:switchboard@localhost:5432/switchboard
services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: switchboard
      POSTGRES_PASSWORD: switchboard
      POSTGRES_DB: switchboard
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - switchboard-pg:/var/lib/postgresql/data
volumes:
  switchboard-pg:
